name: tech-demo

on:
  push:
    paths:
      - "tech-demo/**"
      - ".github/workflows/tech-demo.yml"
  pull_request:
    paths:
      - "tech-demo/**"

defaults:
  run:
    working-directory: tech-demo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tech-demo/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
